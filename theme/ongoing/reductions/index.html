<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Isogeny Reduction Graph</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/elkjs/lib/elk.bundled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
    <script>
        MathJax = {
            tex: {
                inlineMath: [
                    ["$", "$"]
                ],
                packages: ['base', 'ams', 'textmacros']
            },
            loader: {
                load: ['[tex]/textmacros']
            }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
</head>

<body>
    <div id="toolbar">
        <input id="search" placeholder="Search problem or keyword...">
        <div id="conditions-menu" style="margin-top: 10px; background: white; padding: 10px; border-radius: 8px; border: 1px solid #ccc; min-width: 200px;">
            <div id="conditions-header" style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none;">
                <h3 style="margin: 0; font-size: 14px;">Conditions</h3>
                <span id="conditions-toggle" style="font-size: 16px; font-weight: bold; transition: transform 0.3s ease;">▶</span>
            </div>
            <div id="conditions-content" style="display: none; flex-direction: column; gap: 5px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee;">
                <!-- Populated dynamically -->
            </div>
        </div>
    </div>

    <div id="sidebar">
        <div id="info">
            Select a problem or a reduction
        </div>
    </div>

    <svg id="graph"></svg>
    <script src="app.js"></script>
</body>

</html>
