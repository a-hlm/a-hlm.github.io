<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Isogeny Reduction Graph</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/elkjs/lib/elk.bundled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$']]
            }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js">
    </script>
</head>

<body>
    <div id="toolbar">
        <input id="search" placeholder="Search problems or keywords separated by comma...">
    </div>

    <div id="sidebar">
        <div id="info">
            Select a node or a dashed arrow for details.
        </div>
    </div>

    <svg id="graph"></svg>
    <script src="app.js"></script>
</body>

</html>
