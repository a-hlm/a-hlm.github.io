<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Isogeny Reduction Graph</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/elkjs/lib/elk.bundled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
    <script>
        MathJax = {
            tex: {
                inlineMath: [
                    ["$", "$"]
                ],
                packages: ['base', 'ams', 'textmacros']
            },
            loader: {
                load: ['[tex]/textmacros']
            }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
</head>

<body>
    <div id="toolbar">
        <input id="search" placeholder="Search problem or keyword...">
        <div id="conditions-menu" style="margin-top: 10px; background: white; padding: 10px; border-radius: 8px; border: 1px solid #ccc; min-width: 200px;">
            <h3 style="margin: 0 0 8px 0; font-size: 14px;">Conditions</h3>
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <!-- Populated dynamically -->
            </div>
        </div>
    </div>

    <div id="sidebar">
        <h2>Problem information</h2>
        <div id="info">
            Select a node
        </div>
    </div>

    <svg id="graph"></svg>
    <script src="app.js"></script>
</body>

</html>
